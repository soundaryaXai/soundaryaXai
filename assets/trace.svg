<svg width="880" height="330" viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular,Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#0E121B"/>
    </linearGradient>
  </defs>

  <rect width="880" height="330" rx="10" fill="url(#bg)" stroke="#1E2430" stroke-width="1"/>

  <!-- window chrome -->
  <rect width="880" height="34" rx="10" fill="#11151F"/>
  <rect y="24" width="880" height="10" fill="#11151F"/>
  <circle cx="24" cy="17" r="5" fill="#3A3F4B"/>
  <circle cx="42" cy="17" r="5" fill="#3A3F4B"/>
  <circle cx="60" cy="17" r="5" fill="#3A3F4B"/>
  <text x="440" y="21" fill="#5B6472" font-size="12" text-anchor="middle">agent-run.trace — zsh</text>

  <!-- log lines -->
  <g font-size="13.5">
    <text x="26" y="64"><tspan fill="#5B6472">[0.00s]</tspan><tspan fill="#8B93A1" dx="10">boot</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">initializing agent runtime</tspan></text>

    <text x="26" y="90"><tspan fill="#5B6472">[0.14s]</tspan><tspan fill="#8B93A1" dx="10">load</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">tools: retriever, executor, validator</tspan></text>

    <text x="26" y="116"><tspan fill="#5B6472">[0.31s]</tspan><tspan fill="#8B93A1" dx="10">context</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">assembled — 14 docs, 3.2k tokens</tspan></text>

    <text x="26" y="142"><tspan fill="#5B6472">[0.52s]</tspan><tspan fill="#E8A33D" dx="10">plan</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">decompose → retrieve → reason → act → verify</tspan></text>

    <text x="26" y="168"><tspan fill="#5B6472">[1.08s]</tspan><tspan fill="#63B3ED" dx="10">action</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">query_vector_store(query, k=6)</tspan></text>

    <text x="26" y="194"><tspan fill="#5B6472">[1.42s]</tspan><tspan fill="#8B93A1" dx="10">observe</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">6 candidates returned, top score 0.91</tspan></text>

    <text x="26" y="220"><tspan fill="#5B6472">[2.01s]</tspan><tspan fill="#E8A33D" dx="10">reason</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">selecting highest-confidence path</tspan></text>

    <text x="26" y="246"><tspan fill="#5B6472">[2.30s]</tspan><tspan fill="#63B3ED" dx="10">action</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">execute_tool(schema_validate)</tspan></text>

    <text x="26" y="272"><tspan fill="#5B6472">[2.85s]</tspan><tspan fill="#6FCF97" dx="10">result</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">passed — writing output</tspan></text>

    <text x="26" y="298"><tspan fill="#5B6472">[3.00s]</tspan><tspan fill="#6FCF97" dx="10">done</tspan><tspan fill="#5B6472" dx="6">·</tspan><tspan fill="#C9D1D9" dx="6">agent run complete</tspan></text>
  </g>

  <!-- blinking cursor -->
  <rect x="230" y="288" width="9" height="14" fill="#E8A33D">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
