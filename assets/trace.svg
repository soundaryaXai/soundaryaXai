<svg width="880" height="340" viewBox="0 0 880 340" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular,Consolas,Menlo,monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000"/>
      <rect y="2" width="4" height="2" fill="#020403"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#04120A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="880" height="340" fill="#000000"/>
  <rect width="880" height="340" fill="url(#scan)" opacity="0.35"/>

  <!-- title bar -->
  <rect width="880" height="30" fill="#050805"/>
  <circle cx="22" cy="15" r="4.5" fill="#123319"/>
  <circle cx="38" cy="15" r="4.5" fill="#123319"/>
  <circle cx="54" cy="15" r="4.5" fill="#123319"/>
  <text x="440" y="19" fill="#1F7A3F" font-size="11" text-anchor="middle">session — /var/log/agent</text>
  <line x1="0" y1="30" x2="880" y2="30" stroke="#0F2916" stroke-width="1"/>

  <g filter="url(#glow)" font-size="13.5">
    <text x="26" y="62"><tspan fill="#1F7A3F">guest@systems:~$</tspan><tspan fill="#7BFFA0" dx="8">tail -f agent-run.log</tspan></text>

    <text x="26" y="94"><tspan fill="#1F7A3F">[0.00s]</tspan><tspan fill="#33FF66" dx="10">boot</tspan><tspan fill="#1F7A3F" dx="6">::</tspan><tspan fill="#B9FFCB" dx="6">initializing agent runtime</tspan></text>

    <text x="26" y="120"><tspan fill="#1F7A3F">[0.31s]</tspan><tspan fill="#33FF66" dx="10">ctx</tspan><tspan fill="#1F7A3F" dx="6">::</tspan><tspan fill="#B9FFCB" dx="6">assembled — 14 docs, 3.2k tokens</tspan></text>

    <text x="26" y="146"><tspan fill="#1F7A3F">[0.52s]</tspan><tspan fill="#33FF66" dx="10">plan</tspan><tspan fill="#1F7A3F" dx="6">::</tspan><tspan fill="#B9FFCB" dx="6">decompose → retrieve → reason → act → verify</tspan></text>

    <text x="26" y="172"><tspan fill="#1F7A3F">[1.08s]</tspan><tspan fill="#33FF66" dx="10">exec</tspan><tspan fill="#1F7A3F" dx="6">::</tspan><tspan fill="#B9FFCB" dx="6">query_vector_store(query, k=6)</tspan></text>

    <text x="26" y="198"><tspan fill="#1F7A3F">[1.42s]</tspan><tspan fill="#33FF66" dx="10">obs</tspan><tspan fill="#1F7A3F" dx="6">::</tspan><tspan fill="#B9FFCB" dx="6">6 candidates — top score 0.91</tspan></text>

    <text x="26" y="224"><tspan fill="#1F7A3F">[2.30s]</tspan><tspan fill="#33FF66" dx="10">exec</tspan><tspan fill="#1F7A3F" dx="6">::</tspan><tspan fill="#B9FFCB" dx="6">execute_tool(schema_validate)</tspan></text>

    <text x="26" y="250"><tspan fill="#1F7A3F">[2.85s]</tspan><tspan fill="#7BFFA0" dx="10">ok</tspan><tspan fill="#1F7A3F" dx="6">::</tspan><tspan fill="#B9FFCB" dx="6">passed — writing output</tspan></text>

    <text x="26" y="282"><tspan fill="#1F7A3F">guest@systems:~$</tspan><tspan fill="#7BFFA0" dx="8">whoami</tspan></text>
    <text x="26" y="306"><tspan fill="#E8FFEC">ai systems engineer · full-stack developer</tspan></text>
  </g>

  <rect x="252" y="296" width="9" height="14" fill="#33FF66" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect width="880" height="340" fill="url(#vignette)"/>
</svg>
